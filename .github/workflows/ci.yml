name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Docker gateway IP
        id: get-ip
        run: |
          GATEWAY_IP=$(docker network inspect bridge | jq -r '.[0].IPAM.Config[0].Gateway')
          echo "GATEWAY_IP=$GATEWAY_IP" >> $GITHUB_ENV
          echo "Docker gateway IP: $GATEWAY_IP"

      - name: Generate SSL and .env
        run: |
          make ssl
          make check-env

      - name: Check docker-compose config
        run: docker compose config

      - name: Start containers
        run: make up

      - name: Wait for containers to be ready
        run: sleep 30

      - name: Check WordPress
        run: |
          curl -k -f --resolve site.local:443:${{ env.GATEWAY_IP }} https://site.local || exit 1

      - name: Check Grafana
        run: |
          curl -f --resolve metrics.local:80:${{ env.GATEWAY_IP }} http://metrics.local || exit 1

      - name: Show logs if failed
        if: failure()
        run: docker compose logs --tail=50
