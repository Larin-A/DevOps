services:
  # БД MariaDB
  db:
    image: mariadb:11.4
    container_name: wp-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      timeout: 20s
      retries: 10
      start_period: 10s

  # Движок WordPress на PHP-FPM
  wordpress:
    image: wordpress:6.7-php8.3-fpm
    container_name: wp-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - ./wordpress-data:/var/www/html
    networks:
      - app-network
    restart: unless-stopped

  # Веб-сервер Nginx
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx-proxy
    depends_on:
      - wordpress
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/site.local.conf:/etc/nginx/conf.d/site.local.conf:ro
      - ./configs/nginx/metrics.local.conf:/etc/nginx/conf.d/metrics.local.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./wordpress-data:/var/www/html:ro
    networks:
      - app-network
    restart: unless-stopped

  # Prometheus - сбор метрик
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped

  # Grafana - визуализация метрик
  grafana:
    image: grafana/grafana:13.1.2
    container_name: grafana
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

  # Node Exporter - сбор метрик c хоста
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network
    restart: unless-stopped

# Общая сеть для всех контейнеров
networks:
  app-network:
    driver: bridge

# Тома Docker
volumes:
  db_data:
  prometheus_data:
  grafana_data:
