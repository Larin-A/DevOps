---
- name: Deploy test-task
  hosts: localhost
  connection: local
  become: yes
  vars_files:
    - vars.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - make
          - git
          - openssl
          - fail2ban
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Start Docker daemon
      shell: |
        nohup dockerd > /var/log/dockerd.log 2>&1 &
      async: 10
      poll: 0
      ignore_errors: yes

    - name: Wait for Docker socket
      wait_for:
        path: /var/run/docker.sock
        timeout: 30
        state: present

    - name: Wait for Docker to be ready
      shell: docker info
      register: docker_info
      until: docker_info.rc == 0
      retries: 10
      delay: 3

    - name: Check if Docker is accessible
      command: docker info
      register: docker_info
      ignore_errors: yes

    - name: Fail if Docker is not available
      fail:
        msg: "Docker недоступен. Убедитесь, что Docker установлен и сокет доступен."
      when: docker_info.rc != 0

    - name: Add current user to docker group
      user:
        name: "{{ ansible_env.USER }}"
        groups: docker
        append: yes
      when: ansible_env.USER is defined

    - name: Check if project exists
      stat:
        path: "{{ project_dir }}"
      register: project_exists

    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ branch }}"
        force: yes
      when: not project_exists.stat.exists

    - name: Configure host (hosts + fail2ban)
      command:
        cmd: make configure
        chdir: "{{ project_dir }}"

    - name: Start containers
      command:
        cmd: make up
        chdir: "{{ project_dir }}"

    - name: Show deployment status
      debug:
        msg:
          - "Развертывание завершено!"
          - "WordPress: https://site.local"
          - "Grafana: http://metrics.local (логин/пароль из .env)"
          - "Prometheus: http://localhost:9090"
          - ""
          - "Для смены окружения выполните в папке проекта:"
          - "  make set-enviroment ENV=prod && make up"
