# Шаблон для включения дебаг-режима (включение портов мониторинга)
# Скопируйте этот файл в docker-compose.override.yml и перезапустите стек

services:
  # Открываем порт Prometheus для прямого доступа
  prometheus:
    ports:
      - "9090:9090"

  # Открываем порт Grafana для прямого доступа
  grafana:
    ports:
      - "3000:3000"

  # Открываем порт Node Exporter для проверки метрик
  node-exporter:
    ports:
      - "9100:9100"
