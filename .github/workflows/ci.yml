name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SSL and .env
        run: |
          make ssl
          make check-env

      - name: Check docker-compose config
        run: docker compose config

      - name: Start containers
        run: make up

      - name: Wait for containers to stabilize
        run: sleep 10

      - name: Check containers status
        run: |
          echo "Статус контейнеров:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          RUNNING=$(docker ps -q | wc -l)
          TOTAL=$(docker compose ps -q | wc -l)
          if [ "$RUNNING" -ne "$TOTAL" ]; then
            echo "Ошибка: запущено $RUNNING из $TOTAL контейнеров"
            docker compose ps
            exit 1
          else
            echo "Успешно: все $TOTAL контейнеров запущены"
          fi

      - name: Show logs if failed
        if: failure()
        run: docker compose logs --tail=50
